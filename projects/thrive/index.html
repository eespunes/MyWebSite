        "facts": [
          { "label": "Role", "value": "Solo: design → release" },

        "highlights": [

        ],

        "sections": [
          {
            "id": "problem",
            "title": "The problem",
            "kind": "prose",
            "lead": "Running a household is *a shared job with no shared tool*.",
            "body": [
              "The budget lives in one parent's spreadsheet, appointments in another's phone, the shopping list on the fridge and the chores nowhere at all. Everyone has a piece of the picture and nobody has all of it.",
              "Thrive gives the whole family one workspace: money, calendar, lists and meals, synced live between phones, with a wall tablet in the kitchen for the kids."
            ]
          },
          {
            "id": "how",
            "title": "How it works",
            "kind": "steps",
            "lead": "One family, *many screens*.",
            "items": [
              { "title": "Create or join a family", "body": "The owner creates the family and shares its username and password. Members join from their own phones; kids can get their own restricted login." },

            "title": "Joining a family",
            "kind": "formula",
            "lead": "The join password is checked *by the database rules*, not by a server.",
            "codeLabel": "Family join · client + Firestore rules",
            "code": [
              "// owner: store a slow, salted hash on the family (members-only)",
              "salt     = random()                       // public, on the handle doc",
              "joinHash = sha256^30000(salt + password)  // min. 8 characters",
              "",
              "// joiner: prove the password without sending it",
              "joinProof = sha256^30000(salt + typed)",
              "update(family, { joinProof, memberUids: [...memberUids, myUid] })",
              "",
              "// rules: accept only a matching proof that adds only yourself",
              "allow update: if joinProof == joinHash",
              "             && added(memberUids) == [request.auth.uid]"
            ],
            "note": "The plaintext password is never stored, on the server or on the device. The rules are tested against the Firestore emulator in CI."

                "tradeoff": "The rules carry real logic, so they get their own emulator test suite and are kept compatible with the previous app version."
              },
              {
                "title": "One document per record",
                "why": "Small documents mean edits by two family members rarely collide, and a save uploads *only what changed*.",
                "tradeoff": "Many more documents to read, so screens reuse live listeners and skip reloads for 15 seconds."
              },
              {
                "title": "No offline cache, an explicit journal",
                "why": "Every screen shows what the server holds, so the family never sees *two different versions* of the budget.",
                "tradeoff": "Edits that can't reach the server are journalled and offered back in Settings, to apply or discard, after a restart."
              },
              {
                "title": "Local mode first",
                "why": "The app is usable before anyone creates an account, and the same code path powers this demo with *no backend*.",

            ]
          }
