        "sections": [
          {
            "id": "problem",
            "title": "The problem",
            "kind": "prose",
            "lead": "Running a household is *a shared job with no shared tool*.",
            "body": [
              "The budget lives in one parent's spreadsheet, appointments in another's phone, the shopping list on the fridge and the chores nowhere at all. Everyone has a piece of the picture and nobody has all of it.",
              "Thrive gives the whole family one workspace: money, calendar, lists and meals, synced live between phones, with a wall tablet in the kitchen for the kids."
            ]
          },
          {
            "id": "how",
            "title": "How it works",
            "kind": "steps",
            "lead": "One family, *many screens*.",
            "items": [
              { "title": "Create or join a family", "body": "The owner creates the family and shares its username and password. Members join from their own phones; kids can get their own restricted login." },

              { "from": 2, "to": 1, "text": "Updates the family: `joinProof`, plus its own uid in `memberUids`" },

              {
                "title": "One document per record",
                "why": "Small documents mean edits by two family members rarely collide, and a save uploads *only what changed*.",

              {
                "title": "No offline cache, an explicit journal",
                "why": "Every screen shows what the server holds, so the family never sees *two different versions* of the budget.",

                "title": "Local mode first",
