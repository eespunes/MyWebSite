name: Version

# Stamps version.json with the commit count after anything lands on master.
# Pushes that only touch version.json are ignored, so the bot's own commit
# cannot trigger another run.
on:
  push:
    branches: [master]
    paths-ignore:
      - version.json

permissions:
  contents: write

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          # rev-list needs the whole history to count commits.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write version.json
        run: node scripts/version.js --next

      - name: Verify it matches CONTENT.md and the renderers
        run: node --test tests/content.test.js tests/version.test.js

      - name: Commit if it changed
        run: |
          if git diff --quiet -- version.json; then
            echo "version.json already current — nothing to do"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: stamp $(node -p "require('./version.json').version")"
          git push
